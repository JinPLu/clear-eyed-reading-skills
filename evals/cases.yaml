      - "系统核验六类伴生证据，并指出论文、代码与审稿之间的实质不一致"
      - "展开会改变复用或质疑的实现与证据细节，并对完整研究论文给出有证据理由的五维评分"
      - "不把社区热度或复刻数量写成新意，也不把情绪化讨论当成证据"

  - id: quick-upgrade-to-deep
