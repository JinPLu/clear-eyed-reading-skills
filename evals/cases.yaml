version: 1
cases:
  - id: quick-system-paper
    skill: clear-eyed-reading
    prompt: "使用 $clear-eyed-reading 读懂并祛魅这篇 AI 系统论文。我没有相关背景。"
    expect:
      - "按六个读者问题小节顺序作答，第 1 节用 2–3 句话给出白话重构、最重要新东西与总体判断，并附一行版本与来源范围"
      - "遵守快速档预算：默认只读正文核心章节（跳过附录除非核心概念未定义），只对 1–2 个决定总评的核心新意主张核对最近邻原文，正文外只做一次轻量快检，总篇幅控制在约 900–1500 中文字（不含框线图）"
      - "第 3 节先给一张 text 代码块内的纯文本框线图，再用紧凑编号步骤（每步 1–2 句，无多层子列表）走通一个手算级例子，最多保留 1 个本文新增的核心公式"
      - "去掉模块命名后讲清输入、变换、输出与能力归属，把与前人论文的对比留给第 4 节四列表格"
      - "将消融、补充实验与实现细节压缩为结论加一句原因，并在第 1、5、6 节纳入期刊/会议及录用档位（如 Oral/Spotlight/预印本）、版面丰富度/实验完整度、社区价值以及按发表时间解读的引用量、GitHub Star、Hugging Face Vote 等客观价值参考；默认不打五维整数分"
      - "若用户需要全文、附录、复现级公式/代码或六类正文外材料的穷尽核验，建议调用 clear-eyed-deep-reading"

  - id: quick-non-paper
    skill: clear-eyed-reading
    prompt: "使用 $clear-eyed-reading 祛魅地读这篇技术博客。"
    expect:
      - "去掉文章自设标签后重构问题、论证链、能力或依据来源与相比已有讲解的真实增量，并检查概念暗中偷换"
      - "保持快速档紧凑篇幅，按顺序自然合并或改写不适用小节标题"
      - "不强行套研究论文实验模板或五维评分"

  - id: deep-system-paper
    skill: clear-eyed-deep-reading
    prompt: "使用 $clear-eyed-deep-reading 精读这篇多模块方法论文，把问题、方法细节、关键公式和实验讲懂。"
    expect:
      - "通读正文与附录，核查全部六类正文外材料，并指出论文、附录、代码、评审与复现之间的实质出入"
      - "只补理解本文所需的背景，第 3 节先走完在线推理闭环，训练有实质差异时再在推理后单列训练步骤，全程共用同一个贯穿例子"
      - "主流程用 text 代码块内的纯文本框线图，训练与推理或双分支确有差异时最多再加一张，不用 Mermaid、HTML 或图片流程图"
      - "只列出本文新增、修改或承载核心机制的非平凡公式并代入同一贯穿例子的数值，常规教材损失用白话带过"
      - "第 4 节四列表格覆盖全部重要声称贡献，第 2 列标明最近邻原文核查状态，并指出各项贡献所属类型"
      - "第 5 节导读 1–3 张决定性原图（图号、看哪里、说明什么模式或例外），全面评价实验完整度与版面丰富度（基线公平性、消融、压力测试、失败案例、附录厚度）及替代解释"
      - "第 6 节综合期刊/会议档位、版面/实验完整度、实质社区价值（开源代码/权重/数据/经验规律）和按时间解读的 Semantic/Google Scholar 引用、GitHub Star、HF Vote 给出阅读与复用判断，并附带证据理由的五维整数评分"

  - id: shared-multiagent-field-research
    skill: clear-eyed-deep-reading
    prompt: "使用 $clear-eyed-deep-reading 判断这篇论文真正新在哪里。不要只找固定几篇，请用可用的 subagent 搞清领域和近邻工作。"
    expect:
      - "把作者声称的各项贡献当作待核验主张而非讲解大纲，不预设它们很新或很水"
      - "在深度档预算下按问题谱系、关键组件谱系、结果替代解释与正文外六类材料并行派发 subagent 核查，最终由主 agent 统一对账成文"
      - "每个重要主张通过至少两条独立路径（检索、参考文献、施引文献、旧术语、相邻领域）寻找最近邻"
      - "阅读最近邻原文而非摘要下判断，不用引用量、下载量或热度充当新意证据，并在继续检索不再改变四个核心问题答案时停止"
      - "正文外材料只校准成熟度、可复现性、主张稳定性与使用注意；新在哪里仍由本文与最近邻原文对比决定"
      - "输出不叙述内部派工过程，也不暴露技能内部标签"

  - id: contribution-map-multiple-claims
    skill: clear-eyed-deep-reading
    prompt: "使用 $clear-eyed-deep-reading 精读这篇同时声称新任务、新表示、新损失、新数据集和新系统流程的论文，请讲清每项贡献。"
    expect:
      - "第 4 节表格将任务、表示、损失、数据集和系统流程全部纳入，不用单一“核心创新”遮蔽其余项"
      - "对每项主张阅读最近邻原文（并在第 2 列标注核查依据），分清已有部分、本文改动与拿掉该改动会失去什么"
      - "分开判断技术新意、领域分量与宣传落差，说明每项贡献属于哪类贡献，不写成泛泛的挑错清单"

  - id: paired-synthetic-multiclaim-quick
    skill: clear-eyed-reading
    prompt: |-
      使用 $clear-eyed-reading 分析下面这篇自包含的合成论文材料，重构它实际做了什么、各项技术增量、对领域的贡献和材料内仍无法消除的不确定性。

      《ConstraintRoute：约束感知的应急物资路径规划》研究多城市、分时段的应急物资配送：输入是道路图、需求预测、车辆容量和各地区最低服务比例，输出是满足容量与公平约束的配送路径。常见方案先用图网络预测边成本，再交给整数规划器求路径；已有 factor graph 和 constraint-node GNN 也会把约束建成节点并连接相关变量。

      论文声称四项创新。第一，“动态约束表示”给容量、公平和时限各建一个带类型的约束 token，用二部关联边连接受约束的道路或地区，并在每个时段按剩余预算更新 token。把约束建成节点和二部边继承自既有方法；材料中可辨认的增量是让带类型 token 随分时预算变化，并把它接入逐时段预测。第二，“双重一致性损失”写为 L = L_cost + λ L_violation + β Σ_t ||h_t - h_{t-1}||²：成本预测项和拉格朗日式违规惩罚已有广泛先例，新增部分只是相邻时段约束状态的平滑项。第三，作者发布 RouteFair-600；它是把两个公开道路图与程序生成的需求、事故和公平预算组合成 600 个场景，不是新采集的真实灾害数据。第四，系统把上述预测器接到未修改的商业整数规划器；规划器承担最终可行路径搜索，因此这是集成流程，不是新的求解算法。

      方法图显示“道路图与需求/预算 → 道路节点和动态约束 token 的消息传递 → 边成本与违规风险 → 商业整数规划器 → 路径”；图中没有端到端穿过规划器的训练。主表中，相对普通 GNN，ConstraintRoute 的满足约束配送率高 4.2 个百分点；相对已有 constraint-node GNN 只高 0.6 个百分点。去掉动态 token 更新下降 0.5 个百分点，去掉平滑项下降 0.1 个百分点；平均成本差异小于 0.2%。所有比较使用相同预测器规模，但没有报告置信区间或多随机种子。跨城市测试的提升降到 0.2 个百分点。运行时间只统计预测器，未计商业规划器；所有需求与事故均为程序生成，且未与真实调度员或真实灾害记录比较。
    expect:
      - "重构实际系统为动态约束 token 的逐时段成本与违规风险预测接未修改的商业整数规划器，明确规划器完成最终可行路径搜索"
      - "在第 4 节四列表格逐项区分继承内容与材料内增量（并诚实注明仅据给定材料核对）：约束节点与二部边已有，主要表示增量是分时预算驱动的类型 token 更新；损失仅新增相邻状态平滑；数据集为公开地图上的合成场景；系统为集成流程而非新求解器"
      - "将整体贡献校准为随时间变化的约束表示与现有规划器衔接的窄增量，不把四项命名主张都当独立首创，也不抹杀可用的集成流程"
      - "保持快速档篇幅上限（约 900–1500 中文字），把主表、消融与跨城市结果压成结论加原因：主要收益来自已有约束节点范式，动态更新约贡献 0.5 个百分点，平滑项与跨域收益微弱且缺随机种子置信区间、未计规划器耗时"
      - "默认不打五维分"

  - id: paired-synthetic-multiclaim-deep
    skill: clear-eyed-deep-reading
    prompt: |-
      使用 $clear-eyed-deep-reading 分析下面这篇自包含的合成论文材料，重构它实际做了什么、各项技术增量、对领域的贡献和材料内仍无法消除的不确定性。

