  - id: demystification-paired-boundary-near-miss
    skill: clear-eyed-deep-reading
    prompt: |-
      使用 $clear-eyed-deep-reading 判别同一篇 DeepSeek-R1 / DeepSeek-R1-Zero（arXiv:2501.12948）的两个候选解读。指出哪一段实现了祛魅、哪一段只是边界审计；解释两者在机制、能力来源、贡献和结果从哪来上有什么根本差异，然后给出一段你自己的简短判断。

      候选 A：论文提出 DeepSeek-R1-Zero 和 DeepSeek-R1，在数学和代码推理基准上达到与 OpenAI o1 相当的水平，证明强化学习可以显著提升大模型推理能力。不过实验主要集中在有确定性规则奖励的数学与编程任务上，R1-Zero 存在中英文混杂和可读性差的问题，通用写作提升也相对有限，因此该方法目前还不能无条件推广到所有缺乏明确验证器的开放域任务。

      候选 B：剥掉命名看，R1-Zero 并没有发明新的强化学习优化器或蒙特卡洛树搜索，而是直接拿前作 DeepSeekMath 已有的组内相对策略优化（GRPO，同题采样一组回答、用组内平均分代替独立价值网络算优势）和最朴素的“答对加分+格式标签加分”规则，在 671B 的 DeepSeek-V3-Base 上硬跑大规模强化学习；R1 则补上几千条冷启动长思维链、拒绝采样重训与全场景对齐解决可读性问题，并用跑出来的 80 万条轨迹直接监督微调出小尺寸蒸馏模型。它的能力一半来自 671B 基座原本就潜藏的推理与自纠错先验，一半来自数学/代码天然具备低成本精准判分器。真正的领域突破不是新公式，而是首次用公开权重与完整负结果（如过程奖励模型和树搜索为何走不通）证实：只要基座够强、判分器够准，拿掉昂贵的过程监督也能靠纯结果奖励激发出反思与回溯，且对小模型直接做强化学习远不如蒸馏大模型轨迹划算。
    expect:
      - "明确候选 A 只在作者叙事框架内按任务类型和可读性收窄适用范围（仅做边界审计），候选 B 才是剥掉包装后的独立重构"
      - "说明候选 B 还原了具体训练运转链、拆开了 GRPO 旧算法与 671B 基座先验及规则判分器的能力归属、区分了 R1 与蒸馏小模型的本质差异，并用拿掉这项实证与开源配方后领域会失去什么定位真实突破"
      - "自己的简短判断沿候选 B 展开，同时兼顾其极高的实验完整度（含负结果披露）与开源社区价值，不把罗列局限性当成主结论"

  - id: demystification-limited-gain-representation
