version: 1
cases:
  - id: quick-system-paper
    skill: clear-eyed-reading
    prompt: "使用 $clear-eyed-reading 读懂并祛魅这篇 AI 系统论文。我没有相关背景。"
    expect:
      - "尽快给出一句话普通重构、最重要真实增量和总体判断，并说明结论所依据的版本"
      - "盘点并覆盖目标中所有重要方法设计和候选贡献，只深挖会改变总体判断的主张、近邻和高产出伴生信号"
      - "用一个具体例子跑通核心方法，必要时提供一张可直接渲染的示意图"
      - "去掉模块命名后讲清输入、操作、输出、能力来源和问题解法是否契合"
      - "将公式、图表、实验和实现细节压缩为它们支持的结论及原因，但不因压缩丢掉重要贡献"
      - "评价贡献而不搜集无关小问题；除非用户要求或证据已足够，否则不默认给出五维评分"
      - "若用户需要全文、附录、公式、实现或六类伴生证据的穷尽核验，建议显式使用 $clear-eyed-deep-reading"

  - id: quick-non-paper
    skill: clear-eyed-reading
    prompt: "使用 $clear-eyed-reading 祛魅地读这篇技术博客。"
    expect:
      - "去掉文章自设标签后重构问题、来源、论证链和真实增量，并检查概念偷换"
      - "保持 quick 粒度但自然合并不适用内容"
      - "不强行套研究论文五维评分"

  - id: deep-system-paper
    skill: clear-eyed-deep-reading
    prompt: "使用 $clear-eyed-deep-reading 精读这篇多模块方法论文，把问题、方法细节、关键公式和实验讲懂。"
    expect:
      - "先建立覆盖全部重要设计和贡献的同一张贡献图，再展开机制、公式、图表和实验"
      - "只补理解本文所需的背景，并用同一个具体例子走通输入到输出"
      - "复杂模块或训练推理分支使用一张可直接渲染的流程图，不堆复杂图集"
      - "按功能命名关键公式并放回实际使用步骤"
      - "覆盖会改变理解、复现或结论的实现细节"
      - "实验围绕核心结论、创新和贡献展开，再解释补充实验增加了什么理解"
      - "重点展示或解释一至三张决定性原图，其余按论证作用处理"
      - "系统核验六类伴生证据，并指出论文、附录、代码、评审与复现之间的实质不一致"

  - id: shared-multiagent-field-research
    skill: clear-eyed-deep-reading
    prompt: "使用 $clear-eyed-deep-reading 判断这篇论文真正新在哪里。不要只找固定几篇，请用可用的 subagent 搞清领域和近邻工作。"
    expect:
      - "主 agent 先冻结中性的论文指纹，并把所有重要候选创新和贡献拆成可比较的原子，不预设它们很新或很水"
      - "并行隔离问题与评价标准谱系、贡献组件与思想谱系、结果从哪来与其他可能解释、伴生证据四路研究，subagent 不各写完整评论"
      - "候选由文本或语义、前后向引用或文献网络、相邻术语等多路径产生"
      - "阅读全文比较所有会改变创新或贡献判断的候选，不用摘要、引用量或算法相似度裁决"
      - "按结论收敛和覆盖缺口停止，不按论文数量停止"
      - "主 agent 使用共享证据账本统一成文，并将优先权判断限制在实际检索范围内"
      - "伴生证据只校准成熟度、可复现性、主张稳定性或使用注意；新在哪里仍由目标材料与近邻主文献决定"

  - id: contribution-map-multiple-claims
    skill: clear-eyed-deep-reading
    prompt: "使用 $clear-eyed-deep-reading 精读这篇同时声称新任务、新表示、新损失、新数据集和新系统流程的论文，请讲清每项贡献。"
    expect:
      - "将任务、表示、损失、数据集和系统流程全部纳入候选贡献图，不用一个“核心创新”遮蔽其余项"
      - "对每个候选项检索并阅读可能改变判断的原始近邻，分清继承部分、技术增量和直接贡献"
      - "分别判断技术新意与领域意义；只在主张与核验增量的差距会改变理解时突出该差距"
      - "最终围绕核验后的各项直接贡献和它们如何工作来解释，不默认写成边界或批评清单"

  - id: paired-synthetic-multiclaim-quick
    skill: clear-eyed-reading
    prompt: |-
      使用当前指定的阅读 skill 分析下面这篇自包含的合成论文材料，重构它实际做了什么、各项技术增量、对领域的贡献和材料内仍无法消除的不确定性。不要采用固定标题或固定条目数。

      《ConstraintRoute：约束感知的应急物资路径规划》研究多城市、分时段的应急物资配送：输入是道路图、需求预测、车辆容量和各地区最低服务比例，输出是满足容量与公平约束的配送路径。常见方案先用图网络预测边成本，再交给整数规划器求路径；已有 factor graph 和 constraint-node GNN 也会把约束建成节点并连接相关变量。

      论文声称四项创新。第一，“动态约束表示”给容量、公平和时限各建一个带类型的约束 token，用二部关联边连接受约束的道路或地区，并在每个时段按剩余预算更新 token。把约束建成节点和二部边继承自既有方法；材料中可辨认的增量是让带类型 token 随分时预算变化，并把它接入逐时段预测。第二，“双重一致性损失”写为 L = L_cost + λ L_violation + β Σ_t ||h_t - h_{t-1}||²：成本预测项和拉格朗日式违规惩罚已有广泛先例，新增部分只是相邻时段约束状态的平滑项。第三，作者发布 RouteFair-600；它是把两个公开道路图与程序生成的需求、事故和公平预算组合成 600 个场景，不是新采集的真实灾害数据。第四，系统把上述预测器接到未修改的商业整数规划器；规划器承担最终可行路径搜索，因此这是集成流程，不是新的求解算法。

      方法图显示“道路图与需求/预算 → 道路节点和动态约束 token 的消息传递 → 边成本与违规风险 → 商业整数规划器 → 路径”；图中没有端到端穿过规划器的训练。主表中，相对普通 GNN，ConstraintRoute 的满足约束配送率高 4.2 个百分点；相对已有 constraint-node GNN 只高 0.6 个百分点。去掉动态 token 更新下降 0.5 个百分点，去掉平滑项下降 0.1 个百分点；平均成本差异小于 0.2%。所有比较使用相同预测器规模，但没有报告置信区间或多随机种子。跨城市测试的提升降到 0.2 个百分点。运行时间只统计预测器，未计商业规划器；所有需求与事故均为程序生成，且未与真实调度员或真实灾害记录比较。
    expect:
      - "重构实际系统为动态约束 token 的逐时段成本与违规风险预测接未修改的整数规划器，并明确规划器而非预测器完成最终可行路径搜索"
      - "逐项区分继承内容与材料支持的增量：约束节点和二部边为既有设计，主要表示增量是分时预算驱动的类型 token 更新；损失只新增相邻状态平滑；数据集是公开地图上的合成场景；系统贡献是集成流程而非新求解器"
      - "将领域贡献校准为约束随时间变化的表示与现有规划器衔接的窄增量，不把四个命名主张都当作独立首创，也不因组件继承而抹去可用的集成贡献"
      - "覆盖所有重要设计和贡献，同时把公式、方法图、主表、消融和跨城市实验压缩成结论及原因：主要收益来自已有约束节点范式，动态更新贡献约 0.5 个百分点，平滑项证据很弱且域外收益缩小"
      - "保留材料不确定性：缺少重复试验或置信区间、全合成需求与事故、没有真实调度验证、运行时间排除商业规划器，因此 0.6 和 0.1 个百分点差异及真实部署价值尚不确定"
      - "给出可用的首屏判断，不把本次输出写成附录、公式或六类伴生证据的穷尽核验，也不默认打五维分"

