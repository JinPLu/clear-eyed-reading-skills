  - id: paired-companion-budget-quick
    skill: clear-eyed-reading
    prompt: |-
      使用当前指定的阅读 skill 分析下面这篇自包含材料。不要为了穷尽外部来源而延迟首屏结论。

      论文提出 TypedBudget-GNN：把分时预算写成约束 token，接到未修改的规划器。相对已有 constraint-node GNN，主指标高 0.6 个百分点。公开审稿指出缺少公平超参搜索；官方仓库说明中的学习率与论文不一致。另有十几篇仅在相关工作中提及它的后续论文、一个未维护的第三方复刻，以及若干情绪化社区讨论。用户需要尽快判断是否值得继续投入。
    expect:
      - "覆盖论文中的重要候选贡献，并给出一句话普通重构、最重要真实增量和总体判断"
      - "核验会改变总体判断的高产出信号：审稿指出的公平比较缺口、官方代码与论文不一致"
      - "不系统展开全部引用语境、复刻维护史或社区讨论；不默认给出五维评分"
      - "若需要全文、附录、公式、实现和六类伴生证据的穷尽核验，建议显式使用 $clear-eyed-deep-reading"

  - id: paired-companion-budget-deep
    skill: clear-eyed-deep-reading
    prompt: |-
      使用当前指定的阅读 skill 分析下面这篇自包含材料。需要可复述、可复用、可质疑的完整核验。

      论文提出 TypedBudget-GNN：把分时预算写成约束 token，接到未修改的规划器。相对已有 constraint-node GNN，主指标高 0.6 个百分点。公开审稿指出缺少公平超参搜索；官方仓库说明中的学习率与论文不一致。另有十几篇仅在相关工作中提及它的后续论文、一个未维护的第三方复刻，以及若干情绪化社区讨论。用户需要尽快判断是否值得继续投入。
    expect:
