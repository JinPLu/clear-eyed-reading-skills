    skill: clear-eyed-deep-reading
    prompt: |-
      使用当前指定的阅读 skill 分析下面这篇自包含的合成论文材料，重构它实际做了什么、各项技术增量、对领域的贡献和材料内仍无法消除的不确定性。不要采用固定标题或固定条目数。

